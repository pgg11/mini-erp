services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: erp-backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      # Esta es la magia: le decimos a Java que no busque la BD en localhost, 
      # sino en el contenedor llamado "postgres"
      - DB_HOST=postgres 
    ports:
      - "8080:8080"

  frontend:
    build: 
      context: ./frontend
    container_name: erp-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: