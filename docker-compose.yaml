version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network

  backend:
    build: ./backend
    container_name: erp-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mini_erp_db
      - SPRING_DATASOURCE_USERNAME=erp_user
      - SPRING_DATASOURCE_PASSWORD=erp_password
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    networks:
      - erp_network

  frontend:
    build: ./frontend
    container_name: erp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  postgres_data: